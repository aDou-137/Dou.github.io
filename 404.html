<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Dou's Space</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Background -->
  <div class="bg-wrapper">
    <div class="bg-image"></div>
    <div class="bg-gradient"></div>
    <div class="floating-orbs">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="nav glass">
    <a href="/" class="nav-logo">✦ Dou's Space</a>
    <div class="nav-right">
      <div class="nav-links">
        <a href="/" class="nav-link">首页</a>
        <a href="/archive" class="nav-link">归档</a>
        <a href="/about" class="nav-link">关于</a>
      </div>
      <button class="theme-toggle" aria-label="切换主题">
        <span class="theme-toggle-icon">🌙</span>
      </button>
    </div>
  </nav>

  <!-- 404 Content -->
  <main class="page-404">
    <div class="content-404">
      <div class="error-code">404</div>
      <span class="error-emoji">🌌</span>
      <h1 class="error-title">走丢了…</h1>
      <p class="error-desc">
        这个页面似乎去了另一个维度。<br>
        也许它正在某处旅行，和你的缘分还未到。
      </p>
      <a href="/" class="error-home-btn">回到首页 →</a>
    </div>
  </main>

  <!-- Floating Shapes -->
  <div class="floating-shapes">
    <div class="floating-shape shape-1"></div>
    <div class="floating-shape shape-2"></div>
    <div class="floating-shape shape-3"></div>
  </div>

  <!-- Footer -->
  <footer class="footer glass">
    <p>&copy; 2026 Dou's Space · Powered by GitHub Pages</p>
  </footer>

  <script src="/script.js"></script>
</body>
</html>
